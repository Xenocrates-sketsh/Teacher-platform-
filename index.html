<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-storage.js"></script>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>📚 Teacher Platform</h1>
        <div class="auth-buttons">
            <button id="loginBtn">Teacher Login</button>
            <button id="signupBtn">Teacher Signup</button>
        </div>
    </header>

    <!-- Post Creation (Teachers Only) -->
    <div id="teacherPanel" class="hidden">
        <h2>Create a Lesson</h2>
        <input type="text" id="postTitle" placeholder="Lesson Title">
        <textarea id="postContent" placeholder="Lesson Description"></textarea>
        <input type="file" id="pdfUpload" accept=".pdf">
        <button onclick="createPost()">Publish Lesson</button>
    </div>

    <!-- Lesson Feed -->
    <div id="lessonFeed"></div>

    <!-- Dark Mode Toggle -->
    <button id="darkModeBtn">🌙</button>

    <script src="script.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/9.0.2/firebase-firestore.js"></script>
